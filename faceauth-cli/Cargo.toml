[package]
name = "faceauth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "faceauth"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
faceauth-camera = { path = "../faceauth-camera" }
faceauth-engine = { version = "0.1.0", path = "../faceauth-engine" }
faceauth-daemon = { version = "0.1.0", path = "../faceauth-daemon" }
serde_json.workspace = true
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
nix = { workspace = true, features = ["user", "fs"] }

# Development only: the pose sweep and readout, the record mode of the
# walk-through, and the per-frame gesture recordings. Off in the package.
[features]
dev-tools = ["faceauth-daemon/dev-tools", "faceauth-camera/dev-tools"]
