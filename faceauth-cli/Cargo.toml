[package]
name = "faceauth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "faceauth"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
faceauth-camera.workspace = true
faceauth-engine.workspace = true
faceauth-daemon.workspace = true
serde_json.workspace = true
toml.workspace = true
serde = { workspace = true, features = ["derive"] }
nix = { workspace = true, features = ["user", "fs"] }

# Development only: the pose sweep and readout, the record mode of the
# walk-through, and the per-frame gesture recordings. Off in the package.
[features]
dev-tools = ["faceauth-daemon/dev-tools", "faceauth-camera/dev-tools"]
