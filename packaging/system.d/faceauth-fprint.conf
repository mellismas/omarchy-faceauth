<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Omarchy FaceAuth: fprintd's device signals come only from fprintd.

  Installed as /usr/share/dbus-1/system.d/faceauth-fprint.conf (pacman's
  dbus-reload hook reloads the bus when it lands there). pam_fprintd takes
  the verify result from a signal it matches by fprintd's well-known name,
  and the bus's default policy lets any connection send any other a
  signal, so without this a connection that does not own that name could
  hand a waiting pam_fprintd a result it never got from the reader. Here a
  signal on fprintd's device interface reaches a receiver only from the
  connection that owns net.reactivated.Fprint, which only root may own
  (fprintd's own net.reactivated.Fprint.conf). Every pam_fprintd on the
  machine gets this, stock Omarchy's lines included, not only faceauth's.

  The rules are mandatory, not default: the bus applies a user or group
  context after the default one, so another package's root policy that
  allowed receiving signals broadly would undo default rules for exactly
  the root receivers that matter (sudo's stack, faceauth's check), and it
  applies the mandatory context after all of them. faceauthd offers the
  fingerprint only while this file is installed as shipped
  (consent/fprint.rs, fprint_offer), and doctor's fprint.bus_policy says
  whether it is.
-->
<busconfig>
  <policy context="mandatory">
    <deny receive_type="signal" receive_interface="net.reactivated.Fprint.Device"/>
    <allow receive_type="signal" receive_interface="net.reactivated.Fprint.Device" receive_sender="net.reactivated.Fprint"/>
  </policy>
</busconfig>
