# /etc/faceauth/config.toml
#
# Every key is optional and every line below is commented out, so this file
# sets nothing: the daemon runs on its built-in defaults, which are the
# values shown, and a default that changes in a later package reaches an
# install that never edited the file. Uncomment a line to change it. The
# three [presence] keys left explicit are the ones `faceauth presence on|off`
# rewrites in place; they are at their defaults too.
#
# Keys the daemon does not know are named in the journal at start (a value
# meant for the top level but written under [presence] lands there). A value
# that would switch a check off (required_matches = 0, accept_threshold
# outside (0, 1]) stops the daemon from starting, and every stack it sits
# in falls to the password. The store (/var/lib/faceauth), the socket
# (/run/faceauth/sock) and the Omarchy tree (/etc/omarchy.conf, else the
# package) are fixed; they are not keys.

# models_dir = "/usr/share/faceauth/models"   # the files come from the omarchy-faceauth-models package
# accept_threshold = 0.70     # cosine similarity a frame must reach to match; set on one subject's face, the false-accept rate is unmeasured (README)
# required_matches = 2        # frames at or above the threshold within one attempt
# attempt_timeout = 6.0       # seconds an attempt may run
# min_detection = 0.6         # detector score under which a frame is not a face
# liveness_required = true    # the flash-response gate runs whenever the sensor has the strobe controls; when it cannot run, refuse to authenticate (false accepts that a print can pass)
# ir_video = "/dev/video2"    # name the IR camera instead of detecting the IPU3 graph; a UVC module has no strobe control, so with liveness_required the daemon refuses every attempt on one
# ir_subdev = "/dev/v4l-subdev7"
# ir_orientation = [true, true, true]   # transpose, flip_x, flip_y: Surface Book 2 mounting
# consent_scan_seconds = 20   # how long a consent request waits for a face to appear before the nods are disarmed
# consent_seconds = 90        # how long nods are read after a match, never under 10; then the camera rests and an attentive face re-arms it (no deadline)
# gesture_trace = false       # development builds only: write each consent round's per-frame recording under the store (docs/DEVELOPMENT.md); the package has no such key
# gesture_record_only = false # development builds only: recognise gestures but never act on them (docs/DEVELOPMENT.md); the package has no such key

[presence]
enabled = false               # auto-lock when the enrolled user leaves; opt-in (faceauth presence on|off)
user = ""                     # whose templates define "present"
# mode = "default"            # "default": any face turned to the screen holds the lock off, whoever it is; lock once nobody has been there for away_seconds; a hidden face (hand on chin) holds the clock too
                              # "secure": identity checked on every tick; the first clear miss on a face turned to the screen locks at once; a near miss, an unread face or a hidden one holds while the same shape is still in the chair (a hand on the face, leaning in, a look down at a phone), an empty chair locks after away_seconds, no other face holds the clock
                              # the starting mode; the watched user can switch it until the next restart (faceauth presence mode default|secure)
# tick_seconds = 5.0          # one short look per tick (about 0.45 s of camera; longer on a tick that also strobes for identity and liveness; in the default mode every third tick); 10 s on battery
# battery_tick_seconds = 10.0 # the tick on battery (0 keeps the mains tick)
# away_seconds = 20.0         # unseen for this long -> lock the session
