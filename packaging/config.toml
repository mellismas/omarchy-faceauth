# /etc/faceauth/config.toml : every key optional; these are the defaults.
# Keys the daemon does not know are named in the journal at start (a value
# meant for the top level but written under [presence] lands there). A value
# that would switch a check off (required_matches = 0, accept_threshold
# outside (0, 1], consent_nods = 0, an empty lock_command) stops the daemon
# from starting, and every stack it sits in falls to the password.
models_dir = "/usr/share/faceauth/models"
store_dir = "/var/lib/faceauth"
socket = "/run/faceauth/sock"
accept_threshold = 0.70     # cosine similarity; docs/DEVELOPMENT.md has the measurements behind it
required_matches = 2        # frames at or above the threshold within one attempt
attempt_timeout = 6.0       # seconds
min_detection = 0.6
liveness = true             # flash-response gate (needs a sensor with the strobe control)
liveness_required = true    # refuse to authenticate when the gate cannot run; false accepts that a print can pass
# ir_video = "/dev/video2"  # override camera detection (UVC IR cameras go here)
# ir_subdev = "/dev/v4l-subdev7"
ir_orientation = [true, true, true]   # transpose, flip_x, flip_y: Surface Book 2 mounting

consent_nods = 2            # nods that approve a request; two head shakes refuse
consent_seconds = 90        # how long nods are read after a match; then the camera rests and an attentive face re-arms it (no deadline)
gesture_trace = false       # write each consent round's per-frame recording to <store_dir>/gestures (root-only; for tuning)
gesture_record_only = false # recognise gestures but never act on them (for recording a calibration battery)

[presence]
enabled = false             # auto-lock when the enrolled user leaves; opt-in
user = ""                   # whose templates define "present"
mode = "default"            # "default": a stranger in view never holds the lock off past away_seconds; a hidden face (hand on chin) and one flaky identity check are tolerated
                            # "secure": lock whenever the enrolled user is not positively in frame for away_seconds; one failed identity check counts, nothing else holds the clock
                            # the starting mode; the watched user can switch it until the next restart (faceauth presence mode default|secure)
tick_seconds = 5.0          # one short look (about 0.45 s of camera, 0.8 s when it also checks identity and liveness) per tick; 10 s on battery
identify_every = 3          # identity and liveness check every N ticks; detection every tick
battery_tick_seconds = 10.0 # the tick on battery (0 keeps the mains tick)
battery_identify_every = 3
away_seconds = 20.0         # unseen for this long -> lock the session
require_attention = false   # also require the face to be turned to the camera
max_yaw = 0.25
max_roll_degrees = 25.0
lock_command = ["/usr/bin/faceauth-lock-session", ""]   # an empty second arg means the presence user
state_file = "/run/faceauth/presence.json"
