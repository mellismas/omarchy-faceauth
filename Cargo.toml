[workspace]
resolver = "2"
members = ["faceauth-camera", "faceauth-engine", "faceauth-daemon", "faceauth-cli", "pam_faceauth"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Michael Ellis"]
repository = "https://github.com/mellismas/omarchy-faceauth"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
nix = { version = "0.30", features = ["ioctl", "fs", "poll", "mman", "socket", "uio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
