[workspace]
resolver = "2"
members = ["faceauth-camera", "faceauth-engine", "faceauth-daemon", "faceauth-cli", "pam_faceauth"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Michael Ellis"]
repository = "https://github.com/mellismas/omarchy-faceauth"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
# No default features: the daemon and the CLI log to journald or a
# terminal pipe, so the colour and regex-filter stacks (about 750 KB per
# binary) buy nothing; RUST_LOG=level still works without them.
env_logger = { version = "0.11", default-features = false }
nix = { version = "0.30", features = ["ioctl", "fs", "poll", "mman", "socket", "uio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# One lint policy for every crate (H1): an unsafe operation inside an
# unsafe fn is still spelled out, and clippy's default set is on.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
